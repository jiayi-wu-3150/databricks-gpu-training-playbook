experiment_name: playbook-distributed
mlflow_run_name: ddp-vit-air-8xH100
environment:
  version: 'databricks_ai_v6'
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
code_source:
  type: snapshot
  snapshot:
    root_path: .
env_variables:
  LAUNCHER: torchrun
  NPROC: "8"
  ACCEL: GPU_8xH100
  RUNTIME_TAG: air-8xH100
  EXPERIMENT: /Users/jiayi.wu@databricks.com/playbook-distributed
  DATASET: food101
  EPOCHS: "1"
  BATCH_SIZE: "64"
  NUM_WORKERS: "8"
command: |
  torchrun --standalone --nproc_per_node=8 $CODE_SOURCE_PATH/04_finetune_vision_distributed.py
max_retries: 0
timeout_minutes: 45
