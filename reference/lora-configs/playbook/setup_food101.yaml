experiment_name: playbook-setup
mlflow_run_name: stage-food101
environment:
  version: 'databricks_ai_v6'
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
code_source:
  type: snapshot
  snapshot:
    root_path: .
env_variables:
  DATASET: food101
  DATASET_ID: ethz/food101
  IMAGE_COL: image
  LABEL_COL: label
  N_TRAIN: "20000"
command: |
  python $CODE_SOURCE_PATH/00_setup.py
max_retries: 0
timeout_minutes: 60
